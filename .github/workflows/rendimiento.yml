name: Pruebas de rendimiento

# Cuándo se ejecuta: con cada push a main o a mano desde la pestaña Actions
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  rendimiento:
    runs-on: ubuntu-latest   # máquina virtual Linux nueva y vacía en cada ejecución

    steps:
      # 1. Descargar el repositorio (el commit que se subió)
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      # 2. JMeter 5.6.3 necesita Java 17
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Descargar JMeter y dejar su carpeta bin en el PATH de los pasos siguientes
      - name: Instalar JMeter 5.6.3
        run: |
          wget -q https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz -C "$HOME"
          echo "$HOME/apache-jmeter-5.6.3/bin" >> "$GITHUB_PATH"

      # 4. Levantar la API en segundo plano (proceso de larga duración)
      - name: Levantar la API en el puerto 8080
        run: nohup python3 api/ticketmania_simple.py --puerto 8080 > api.log 2>&1 &

      # 5. No empezar la prueba hasta que /api/salud responda
      - name: Esperar a que la API responda
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080/api/salud; then
              echo ""; echo "API lista"; exit 0
            fi
            echo "Esperando la API ($i/30)..."; sleep 1
          done
          echo "La API no respondió a tiempo"; cat api.log; exit 1

      # 6. Ejecutar el plan en modo no-GUI desde su carpeta (así encuentra datos.csv)
      - name: Ejecutar JMeter
        working-directory: pruebas/jmeter
        run: |
          jmeter --version
          jmeter -n -t Ticketmania.jmx -l resultados.jtl -e -o reporte

      # 7. JMeter no falla solo si una petición responde mal: revisamos el .jtl
      - name: Revisar peticiones fallidas
        working-directory: pruebas/jmeter
        run: |
          python3 - <<'EOF'
          import csv, sys
          with open("resultados.jtl", newline="", encoding="utf-8") as f:
              filas = list(csv.DictReader(f))
          fallidas = [r for r in filas if r["success"].strip().lower() != "true"]
          print(f"Muestras: {len(filas)}  Fallidas: {len(fallidas)}")
          for r in fallidas[:20]:
              print(f"  {r['label']}: {r['responseCode']} {r['responseMessage']} {r.get('failureMessage', '')}")
          if not filas or fallidas:
              sys.exit(1)
          EOF

      # 8. Subir el reporte aunque el paso anterior haya fallado
      - name: Subir el reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-rendimiento
          path: |
            pruebas/jmeter/reporte
            pruebas/jmeter/resultados.jtl
